name: Refresh data from aldo.today

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest CSV
        run: curl -fsSL -A "adelaide-house-prices-by-suburb (GitHub Actions)" https://aldo.today/adelaide.csv -o adelaide-house-prices-by-suburb.csv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adelaide-house-prices-by-suburb.csv
          git diff --cached --quiet || git commit -m "Refresh data from aldo.today"
          git push
